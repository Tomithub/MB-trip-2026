<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Melbourne Trip</title>
<style>
  :root{
    --bg:#0a0f1e; --card:#131a30; --card2:#19223d; --line:#26304f;
    --text:#e9edf9; --muted:#9aa6c7; --accent:#5eead4; --accent2:#fbbf77;
    --warn:#fb7185; --ok:#86efac;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
  body{padding:0 0 env(safe-area-inset-bottom)}
  header{padding:calc(env(safe-area-inset-top) + 22px) 18px 6px}
  header .kicker{color:var(--accent);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  header h1{margin:4px 0 2px;font-size:30px;letter-spacing:-.02em}
  header p{margin:0;color:var(--muted);font-size:14px}
  nav{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,transparent);
    padding:10px 12px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
  nav button small{display:block;font-weight:500;font-size:10px;opacity:.8}
  nav button.on{background:var(--accent);color:#06251f;border-color:var(--accent)}
  main{padding:4px 14px 40px;max-width:720px;margin:0 auto}
  section{display:none}
  section.on{display:block}
  .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--accent2);border:1px solid rgba(251,191,119,.4);padding:2px 8px;border-radius:999px}
  h2{margin:10px 0 2px;font-size:24px;letter-spacing:-.01em}
  .date{color:var(--muted);font-size:14px;margin-bottom:12px}
  .dirbtn{display:inline-block;margin:6px 0 4px;padding:10px 14px;border-radius:12px;background:var(--card2);
    border:1px solid var(--line);color:var(--accent);text-decoration:none;font-weight:600;font-size:14px}
  .label{margin:18px 2px 8px;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  .stop{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px 12px;margin-bottom:8px;color:inherit;text-decoration:none}
  a.stop:active{background:var(--card2)}
  .time{flex:0 0 62px;font-weight:700;color:var(--accent);font-size:14px;padding-top:1px}
  .body{flex:1;min-width:0}
  .name{font-weight:700;font-size:15px}
  .note{color:var(--muted);font-size:13.5px;margin-top:2px}
  .badge{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;
    vertical-align:1px}
  .b-star{background:rgba(251,191,119,.14);color:var(--accent2)}
  .b-free{background:rgba(134,239,172,.14);color:var(--ok)}
  .b-paid{background:rgba(251,113,133,.14);color:var(--warn)}
  .b-opt{background:rgba(154,166,199,.16);color:var(--muted)}
  .chev{color:var(--muted);align-self:center;font-size:18px}
  .callout{margin:16px 0;padding:14px;border-radius:14px;background:rgba(94,234,212,.08);
    border:1px solid rgba(94,234,212,.28);font-size:14px}
  .callout.warn{background:rgba(251,113,133,.08);border-color:rgba(251,113,133,.35)}
  .callout b{color:var(--text)}
  .pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
  .pager button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);
    color:var(--text);font-weight:600;font-size:14px;cursor:pointer}
  h3{margin:20px 2px 8px;font-size:16px}
  ul.list{margin:0 0 6px;padding:0;list-style:none}
  ul.list li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    margin-bottom:8px;font-size:14px}
  ul.list li b{color:var(--text)}
  ul.list li span{color:var(--muted)}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 0 26px}
</style>
</head>

const MAP = "https://www.google.com/maps/search/?api=1&query=";
const enc = encodeURIComponent;

function dir(origin, dest, waypoints, avoidTolls){
  let u = "https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=" + enc(origin) +
          "&destination=" + enc(dest);
  if (waypoints && waypoints.length) u += "&waypoints=" + waypoints.map(enc).join("%7C");
  if (avoidTolls) u += "&avoid=tolls";
  return u;
}

/* ---------- RENDER ---------- */
const BADGE = {star:"b-star", free:"b-free", paid:"b-paid", opt:"b-opt"};
function esc(s){return s.replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function stopHTML(it){
  const badge = it.badge ? `<span class="badge ${BADGE[it.badge[0]]}">${it.badge[0]==="star" ? "&#9733; " : ""}${esc(it.badge[1])}</span>` : "";
  const inner = `<div class="time">${esc(it.time)}</div>
    <div class="body"><div class="name">${esc(it.name)}${badge}</div>${it.note ? `<div class="note">${esc(it.note)}</div>` : ""}</div>
    ${it.q ? '<div class="chev">&rsaquo;</div>' : ""}`;
  return it.q
    ? `<a class="stop" href="${MAP + enc(it.q)}" target="_blank" rel="noopener">${inner}</a>`
    : `<div class="stop">${inner}</div>`;
}

function dayHTML(d){
  let h = `<span class="tag">${esc(d.tag)}</span><h2>${esc(d.title)}</h2><div class="date">${esc(d.date)}</div>`;
  if (d.route) h += `<a class="dirbtn" target="_blank" rel="noopener" href="${dir(d.route.o, d.route.d, d.route.w, d.route.tolls)}">Directions in Google Maps &rsaquo;</a>`;
  d.sections.forEach(s=>{
    h += `<div class="label">${esc(s.label)}</div>` + s.items.map(stopHTML).join("");
  });
  if (d.callout) h += `<div class="callout">${d.callout}</div>`;
  return h;
}

const TABS = [{id:"info", nav:"Info", sub:"Essentials"}].concat(DAYS.map(d=>({id:d.id, nav:d.nav, sub:d.sub})));
const nav = document.getElementById("nav");
const main = document.getElementById("main");

TABS.forEach((t,i)=>{
  const b = document.createElement("button");
  b.dataset.id = t.id;
  b.innerHTML = `${esc(t.nav)}<small>${esc(t.sub)}</small>`;
  b.onclick = ()=>show(t.id);
  nav.appendChild(b);

  const s = document.createElement("section");
  s.id = t.id;
  s.innerHTML = (t.id==="info" ? INFO_HTML : dayHTML(DAYS.find(d=>d.id===t.id))) +
    `<div class="pager">
       ${i>0 ? `<button data-go="${TABS[i-1].id}">&lsaquo; ${esc(TABS[i-1].nav)}</button>` : "<span></span>"}
       ${i<TABS.length-1 ? `<button data-go="${TABS[i+1].id}">${esc(TABS[i+1].nav)} &rsaquo;</button>` : "<span></span>"}
     </div>`;
  main.appendChild(s);
});
main.addEventListener("click", e=>{
  const g = e.target.closest("[data-go]");
  if (g) show(g.dataset.go);
});

function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on", s.id===id));
  document.querySelectorAll("nav button").forEach(b=>{
    const on = b.dataset.id===id;
    b.classList.toggle("on", on);
    if (on) b.scrollIntoView({inline:"center", block:"nearest"});
  });
  try{ history.replaceState(null,"","#"+id); }catch(e){}
  window.scrollTo({top:0});
}

// open on today's day if inside the trip, otherwise the hash, otherwise Info
(function(){
  const byDate = {"2026-11-06":"d1","2026-11-07":"d2","2026-11-08":"d3","2026-11-09":"d4","2026-11-10":"d5","2026-11-11":"d6"};
  const now = new Date();
  const key = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
  const hash = location.hash.replace("#","");
  const start = TABS.some(t=>t.id===hash) ? hash : (byDate[key] || "info");
  show(start);
})();
</script>
